<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>来月の勤務希望（複数月テスト版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yomogi&family=Noto+Sans+JP:wght@400;500;600;700&display=swap">
<style>
  :root {
    --paper: #ECE8DF;
    --paper-line: #D8D2C4;
    --ink: #262A2E;
    --ink-soft: #6B6F72;
    --off: #F7F5EF;
    --day-off: #6B6F8A;
    --paid-off: #2F6F63;
    --work: #C1702C;
    --unset-bg: #F7F5EF;
    --line: #C9C2AF;
  }
  * { box-sizing: border-box; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { margin: 0; font-family: "Noto Sans JP", "Hiragino Sans", system-ui, sans-serif; background: transparent; color: var(--ink); }
  .sheet { max-width: 460px; margin: 0 auto; background: var(--paper); border: 1px solid var(--paper-line); border-radius: 4px; overflow: hidden; }
  .sheet-head { padding: 18px 20px; border-bottom: 1px solid var(--paper-line); }
  .title { font-family: "Yomogi", "Noto Sans JP", "Hiragino Sans", system-ui, sans-serif; font-size: 20px; margin: 0; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .month-picker { display: flex; gap: 6px; overflow-x: auto; padding: 10px 20px; border-bottom: 1px solid var(--paper-line); background: var(--off); -webkit-overflow-scrolling: touch; }
  .month-btn { flex: 0 0 auto; padding: 7px 13px; font-family: inherit; font-size: 13px; font-weight: 600; color: var(--ink-soft); background: #fff; border: 1px solid var(--line); border-radius: 20px; cursor: pointer; white-space: nowrap; }
  .month-btn.active { color: #fff; background: var(--work); border-color: var(--work); }

  .tabs { display: flex; border-bottom: 1px solid var(--paper-line); }
  .tab { flex: 1; padding: 11px 0; text-align: center; font-size: 13.5px; font-weight: 500; color: var(--ink-soft); background: var(--off); border: none; border-bottom: 2px solid transparent; cursor: pointer; }
  .tab.active { color: var(--ink); background: var(--paper); border-bottom: 2px solid var(--work); }
  .panel { padding: 18px 18px 22px; }
  .panel.hidden { display: none; }

  .field-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .field-row label { font-size: 13px; color: var(--ink-soft); width: 44px; flex-shrink: 0; }
  .field-row input { flex: 1; font-family: inherit; font-size: 14.5px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 3px; background: var(--off); color: var(--ink); }

  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin: 12px 0 14px; font-size: 12px; color: var(--ink-soft); }
  .legend span { display: flex; align-items: center; gap: 5px; }
  .swatch { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }

  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 6px; }
  .wd { text-align: center; font-size: 11.5px; color: var(--ink-soft); padding-bottom: 4px; }
  .wd.sun { color: #B5504E; }
  .wd.sat { color: #3E6FA6; }

  .cell { aspect-ratio: 1; border: 1px solid var(--line); border-radius: 3px; background: var(--unset-bg); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; user-select: none; transition: background 0.12s ease, transform 0.06s ease; }
  .cell:active { transform: scale(0.94); }
  .cell.empty { border: none; background: transparent; cursor: default; }
  .cell .num { font-size: 11px; color: var(--ink-soft); line-height: 1; }
  .cell .mark { font-size: 13px; font-weight: 700; line-height: 1.4; }
  .cell.state-off { background: var(--day-off); }
  .cell.state-off .num, .cell.state-off .mark { color: #fff; }
  .cell.state-paid { background: var(--paid-off); }
  .cell.state-paid .num, .cell.state-paid .mark { color: #fff; }
  .cell.state-work { background: var(--work); }
  .cell.state-work .num, .cell.state-work .mark { color: #fff; }

  .actions { display: flex; gap: 8px; margin-top: 16px; }
  .btn { flex: 1; padding: 11px 0; font-family: inherit; font-size: 14px; font-weight: 600; border-radius: 3px; border: none; cursor: pointer; }
  .btn.primary { background: var(--ink); color: var(--off); }
  .btn.ghost { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); flex: 0 0 auto; padding: 11px 16px; }

  .msg { margin-top: 10px; font-size: 12.5px; min-height: 16px; color: var(--ink-soft); }
  .msg.ok { color: var(--paid-off); }
  .msg.err { color: #B5504E; }

  .share { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line); font-size: 11.5px; color: var(--ink-soft); line-height: 1.6; }

  .output-box { margin-top: 14px; padding: 12px; background: var(--off); border: 1px solid var(--line); border-radius: 4px; }
  .output-box.hidden { display: none; }
  .output-box label { display: block; font-size: 11.5px; color: var(--ink-soft); margin-bottom: 6px; }
  .output-box textarea { width: 100%; font-family: "Noto Sans JP", monospace; font-size: 13px; padding: 8px; border: 1px solid var(--line); border-radius: 3px; background: #fff; color: var(--ink); resize: vertical; min-height: 60px; }
  .copy-btn { margin-top: 8px; width: 100%; padding: 9px 0; font-size: 13px; font-weight: 600; background: var(--paid-off); color: #fff; border: none; border-radius: 3px; cursor: pointer; }

  .refresh-btn { margin-bottom: 12px; width: 100%; padding: 10px 0; font-size: 13.5px; font-weight: 600; background: var(--ink); color: var(--off); border: none; border-radius: 3px; cursor: pointer; }

  .list-cell { aspect-ratio: 1; min-width: 0; border: 1px solid var(--line); border-radius: 3px; background: var(--unset-bg); padding: 2px 2px 3px; display: flex; flex-direction: column; gap: 0; overflow: hidden; }
  .list-cell .daynum { font-size: 9.5px; color: var(--ink-soft); line-height: 1.2; flex: 0 0 auto; }
  .list-entries { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  .list-entries.cols2 { display: grid; grid-auto-flow: column; grid-template-columns: 1fr 1fr; column-gap: 3px; }
  .list-entry { display: block; min-width: 0; font-weight: 700; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list-entry.off { color: var(--day-off); }
  .list-entry.paid { color: var(--paid-off); }
  .list-entry.work { color: var(--work); }
  .empty-state { text-align: center; color: var(--ink-soft); font-size: 13px; padding: 30px 10px; }
  .empty-state.hidden { display: none; }

  .print-btn { margin-top: 4px; width: 100%; padding: 10px 0; font-size: 13.5px; font-weight: 600; background: var(--work); color: #fff; border: none; border-radius: 3px; cursor: pointer; }
  .line-hint { margin: 8px 0 4px; padding: 10px 12px; font-size: 12px; line-height: 1.6; color: var(--ink); background: var(--off); border: 1px solid var(--line); border-radius: 4px; }
  .line-hint.hidden { display: none; }

  .test-banner { padding: 8px 20px; font-size: 11.5px; font-weight: 600; letter-spacing: 0.04em; color: #fff; background: var(--day-off); text-align: center; }

  @page { size: A4 landscape; margin: 12mm; }
  @media print {
    body { background: #fff; }
    .sheet { border: none; max-width: 100%; break-inside: avoid; }
    .test-banner, .month-picker, .tabs, .refresh-btn, .print-btn, .line-hint, #listMsg, .field-row, .legend, .actions, .output-box, .share, #inputMsg { display: none !important; }
    #listCalendarGrid, #listWeekdayRow { grid-template-columns: repeat(7, var(--print-cell-mm, 1fr)); justify-content: start; }
  }
</style>
</head>
<body>

<div class="sheet">
  <div class="test-banner">テスト版（複数月入力）v3</div>
  <div class="sheet-head">
    <p class="title" id="pageTitle">読み込み中…</p>
  </div>

  <div class="month-picker" id="monthPicker"></div>

  <div class="tabs">
    <button class="tab active" id="tabInput">入力</button>
    <button class="tab" id="tabList">一覧</button>
  </div>

  <div class="panel" id="panelInput">
    <div class="field-row">
      <label for="nameInput">名前</label>
      <input id="nameInput" type="text" placeholder="例：田中" maxlength="20">
    </div>

    <div class="legend">
      <span><span class="swatch" style="background:var(--day-off)"></span>公休</span>
      <span><span class="swatch" style="background:var(--paid-off)"></span>有休</span>
      <span><span class="swatch" style="background:var(--work)"></span>出勤</span>
      <span><span class="swatch" style="background:var(--unset-bg);border:1px solid var(--line)"></span>未定</span>
    </div>

    <div class="grid" id="weekdayRow"></div>
    <div class="grid" id="calendarGrid"></div>

    <div class="actions">
      <button class="btn primary" id="submitBtn">保存する</button>
      <button class="btn ghost" id="clearBtn">消去</button>
    </div>
    <div class="msg" id="inputMsg"></div>

    <div class="output-box hidden" id="outputBox">
      <label>保存した内容（念のためLINEにも貼り付けたい場合はこちらをコピーしてください）</label>
      <textarea id="submitText" rows="2" readonly></textarea>
      <button class="copy-btn" id="copyBtn">コピーする</button>
    </div>

    <div class="share">
      上のボタンで月を切り替えられます。日付をタップすると 公休→有休→出勤→未定 の順に切り替わります。「保存する」を押すと自動的に記録され、一覧タブでその月・グループ全員分の希望が確認できます。
    </div>
  </div>

  <div class="panel hidden" id="panelList">
    <button class="refresh-btn" id="refreshListBtn">最新の状態に更新</button>
    <div class="msg" id="listMsg"></div>
    <button class="print-btn" id="printBtn">この月の一覧を印刷する</button>
    <p class="line-hint hidden" id="lineHint">LINEの画面のまま印刷しようとすると反応しません。右上の「…」から「他のアプリで開く」または「Safari／Chromeで開く」を選んでから、もう一度お試しください。</p>
    <div class="grid" id="listWeekdayRow"></div>
    <div class="grid" id="listCalendarGrid"></div>
    <p class="empty-state" id="listEmptyState">まだ誰も入力していません。</p>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import { getFirestore, doc, setDoc, getDocs, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDmY2HqcpJTV4CRND5g7tvO__ARxjUBpjM",
  authDomain: "shift-preference-calendar.firebaseapp.com",
  projectId: "shift-preference-calendar",
  storageBucket: "shift-preference-calendar.firebasestorage.app",
  messagingSenderId: "338269908753",
  appId: "1:338269908753:web:e0ee666ee98d4189cf66b0"
};
const firebaseApp = initializeApp(firebaseConfig);
const db = getFirestore(firebaseApp);

(function() {
  const params = new URLSearchParams(location.search);
  const groupId = (params.get("g") || "common").trim();
  const MONTH_COUNT = 6;

  const now = new Date();
  const monthsAhead = now.getDate() >= 20 ? 2 : 1;
  const base = new Date(now.getFullYear(), now.getMonth() + monthsAhead, 1);
  const months = [];
  for (let i = 0; i < MONTH_COUNT; i++) {
    const d = new Date(base.getFullYear(), base.getMonth() + i, 1);
    months.push({ year: d.getFullYear(), month: d.getMonth() });
  }
  let selectedIndex = 0;

  const STATES = ["unset", "off", "paid", "work"];
  const STATE_LABEL = { unset: "", off: "公", paid: "有", work: "出" };
  const STATE_CLASS = { unset: "", off: "state-off", paid: "state-paid", work: "state-work" };
  const WEEKDAYS = ["日", "月", "火", "水", "木", "金", "土"];

  let year, month, daysInMonth, monthTag, firstWeekday, peopleCollection, draftKey;
  let dayStates = [];

  const pageTitle = document.getElementById("pageTitle");
  const nameInput = document.getElementById("nameInput");
  const monthPicker = document.getElementById("monthPicker");

  function buildMonthPicker() {
    monthPicker.innerHTML = "";
    months.forEach((m, i) => {
      const btn = document.createElement("button");
      btn.className = "month-btn" + (i === selectedIndex ? " active" : "");
      const yearPrefix = m.year !== months[0].year ? String(m.year).slice(2) + "/" : "";
      btn.textContent = yearPrefix + (m.month + 1) + "月";
      btn.addEventListener("click", () => selectMonth(i));
      monthPicker.appendChild(btn);
    });
  }

  function applyMonthState() {
    const m = months[selectedIndex];
    year = m.year;
    month = m.month;
    daysInMonth = new Date(year, month + 1, 0).getDate();
    monthTag = year + "-" + String(month + 1).padStart(2, "0");
    firstWeekday = new Date(year, month, 1).getDay();
    peopleCollection = collection(db, "groups", groupId, "months", monthTag, "people");
    draftKey = "shiftDraft:" + groupId + ":" + monthTag;
    dayStates = new Array(daysInMonth).fill("unset");
    pageTitle.textContent = year + "年" + (month + 1) + "月の勤務希望　グループ" + groupId;
  }

  function selectMonth(i) {
    selectedIndex = i;
    buildMonthPicker();
    applyMonthState();
    loadDraft();
    render();
    outputBox.classList.add("hidden");
    setMsg(msg, "");
    if (!panelList.classList.contains("hidden")) {
      loadListFromFirestore();
    }
  }

  function saveDraft() {
    try {
      localStorage.setItem(draftKey, JSON.stringify({ name: nameInput.value, states: dayStates }));
    } catch (e) {}
  }

  function loadDraft() {
    try {
      const raw = localStorage.getItem(draftKey);
      if (!raw) return;
      const d = JSON.parse(raw);
      if (d && Array.isArray(d.states) && d.states.length === daysInMonth) dayStates = d.states;
      if (d && typeof d.name === "string") nameInput.value = d.name;
    } catch (e) {}
  }

  function buildWeekdayRow(container) {
    container.innerHTML = "";
    WEEKDAYS.forEach((w, i) => {
      const el = document.createElement("div");
      el.className = "wd" + (i === 0 ? " sun" : i === 6 ? " sat" : "");
      el.textContent = w;
      container.appendChild(el);
    });
  }
  buildWeekdayRow(document.getElementById("weekdayRow"));
  buildWeekdayRow(document.getElementById("listWeekdayRow"));

  const grid = document.getElementById("calendarGrid");

  function render() {
    grid.innerHTML = "";
    for (let i = 0; i < firstWeekday; i++) {
      const empty = document.createElement("div");
      empty.className = "cell empty";
      grid.appendChild(empty);
    }
    for (let d = 1; d <= daysInMonth; d++) {
      const state = dayStates[d - 1];
      const cell = document.createElement("div");
      cell.className = "cell " + STATE_CLASS[state];
      cell.innerHTML = '<span class="num">' + d + '</span><span class="mark">' + STATE_LABEL[state] + '</span>';
      cell.addEventListener("click", () => {
        const idx = STATES.indexOf(dayStates[d - 1]);
        dayStates[d - 1] = STATES[(idx + 1) % STATES.length];
        render();
        saveDraft();
      });
      grid.appendChild(cell);
    }
  }

  nameInput.addEventListener("input", saveDraft);

  const msg = document.getElementById("inputMsg");
  const outputBox = document.getElementById("outputBox");
  const submitText = document.getElementById("submitText");

  function setMsg(el, text, kind) {
    el.textContent = text;
    el.className = "msg" + (kind ? " " + kind : "");
  }

  document.getElementById("submitBtn").addEventListener("click", async () => {
    const name = nameInput.value.trim();
    if (!name) {
      setMsg(msg, "名前を入力してください。", "err");
      outputBox.classList.add("hidden");
      return;
    }
    const pairs = [];
    for (let d = 1; d <= daysInMonth; d++) {
      const state = dayStates[d - 1];
      if (state === "unset") continue;
      pairs.push(d + STATE_LABEL[state]);
    }
    setMsg(msg, "保存しています…");
    try {
      const personDocId = encodeURIComponent(name);
      await setDoc(doc(peopleCollection, personDocId), {
        name: name,
        states: dayStates,
        updatedAt: serverTimestamp()
      });
      const text = pairs.length > 0 ? (name + " " + monthTag + ": " + pairs.join(" ")) : (name + " " + monthTag + ": 希望なし");
      submitText.value = text;
      outputBox.classList.remove("hidden");
      setMsg(msg, pairs.length > 0 ? "保存しました。一覧タブでこの月・グループ全員分の希望が確認できます。" : "保存しました（希望なしとして記録されました）。", "ok");
    } catch (e) {
      setMsg(msg, "保存に失敗しました。通信環境を確認してもう一度お試しください。", "err");
      outputBox.classList.add("hidden");
    }
  });

  document.getElementById("clearBtn").addEventListener("click", () => {
    dayStates = new Array(daysInMonth).fill("unset");
    render();
    outputBox.classList.add("hidden");
    setMsg(msg, "入力をリセットしました。");
    try { localStorage.removeItem(draftKey); } catch (e) {}
  });

  document.getElementById("copyBtn").addEventListener("click", async () => {
    const text = submitText.value;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
        setMsg(msg, "コピーしました。LINEに貼り付けてください。", "ok");
        return;
      }
      throw new Error("no clipboard api");
    } catch (e) {
      try {
        submitText.focus();
        submitText.select();
        document.execCommand("copy");
        setMsg(msg, "コピーしました。LINEに貼り付けてください。", "ok");
      } catch (e2) {
        setMsg(msg, "自動コピーできませんでした。上の文章を長押しして選択・コピーしてください。", "err");
      }
    }
  });

  // Tabs
  const tabInput = document.getElementById("tabInput");
  const tabList = document.getElementById("tabList");
  const panelInput = document.getElementById("panelInput");
  const panelList = document.getElementById("panelList");

  tabInput.addEventListener("click", () => {
    tabInput.classList.add("active");
    tabList.classList.remove("active");
    panelInput.classList.remove("hidden");
    panelList.classList.add("hidden");
  });
  tabList.addEventListener("click", () => {
    tabList.classList.add("active");
    tabInput.classList.remove("active");
    panelList.classList.remove("hidden");
    panelInput.classList.add("hidden");
    loadListFromFirestore();
  });

  // List view (auto-loaded from Firestore, shared across the group)
  const listGrid = document.getElementById("listCalendarGrid");
  const listEmptyState = document.getElementById("listEmptyState");
  const listMsg = document.getElementById("listMsg");

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  let lastEntries = [];

  async function loadListFromFirestore() {
    const requestedMonthTag = monthTag;
    setMsg(listMsg, "読み込み中…");
    try {
      const snap = await getDocs(peopleCollection);
      if (requestedMonthTag !== monthTag) return; // user switched month while loading
      const entries = [];
      snap.forEach((d) => {
        const data = d.data();
        entries.push({ name: data.name, states: data.states || [] });
      });
      await fontsReady;
      if (requestedMonthTag !== monthTag) return;
      lastEntries = entries;
      renderListGrid(entries);
      if (entries.length === 0) {
        setMsg(listMsg, "");
      } else {
        const names = entries.map((entry) => entry.name).join("、");
        setMsg(listMsg, entries.length + "人が入力済み：" + names, "ok");
      }
    } catch (e) {
      setMsg(listMsg, "読み込みに失敗しました。通信環境を確認してもう一度お試しください。", "err");
    }
  }

  const STATE_ORDER = { off: 0, paid: 1, work: 2 };
  const TWO_COL_THRESHOLD = 5;
  const CELL_GAP = 4;
  const CELL_H_PADDING = 4;
  const CELL_V_PADDING = 5;
  const DAYNUM_HEIGHT = 9.5 * 1.2;
  const COL_GAP = 3;
  const ENTRY_LINE_HEIGHT = 1.05;
  const measureCtx = document.createElement("canvas").getContext("2d");
  const fontsReady = (document.fonts && document.fonts.load)
    ? Promise.all([
        document.fonts.load('700 16px "Noto Sans JP"'),
        document.fonts.load('400 16px "Noto Sans JP"')
      ]).then(() => document.fonts.ready).catch(() => {})
    : Promise.resolve();

  function measureWidth(text, size) {
    measureCtx.font = "700 " + size + 'px "Noto Sans JP", "Hiragino Sans", system-ui, sans-serif';
    return measureCtx.measureText(text).width;
  }

  const WIDTH_SAFETY = 0.93;

  function bestFontSize(texts, colWidth, availableHeight, rows, maxSize) {
    let size = maxSize;
    while (size > 4.2) {
      const widest = Math.max(...texts.map((t) => measureWidth(t, size)));
      const fitsWidth = widest <= colWidth * WIDTH_SAFETY;
      const fitsHeight = size * ENTRY_LINE_HEIGHT * rows <= availableHeight;
      if (fitsWidth && fitsHeight) return size;
      size -= 0.2;
    }
    return 4.2;
  }

  function renderListGrid(entries, cellSizeOverride) {
    listGrid.innerHTML = "";
    if (entries.length === 0) {
      listEmptyState.classList.remove("hidden");
      return;
    }
    listEmptyState.classList.add("hidden");
    for (let i = 0; i < firstWeekday; i++) {
      const empty = document.createElement("div");
      empty.className = "cell empty";
      listGrid.appendChild(empty);
    }
    const gridWidth = listGrid.clientWidth || 460;
    const cellSize = cellSizeOverride || (gridWidth - 6 * CELL_GAP) / 7;
    const availableHeight = cellSize - DAYNUM_HEIGHT - CELL_V_PADDING;
    for (let d = 1; d <= daysInMonth; d++) {
      const cell = document.createElement("div");
      cell.className = "list-cell";
      let dayEntries = entries.filter((entry) => (entry.states[d - 1] || "unset") !== "unset");
      const crowded = dayEntries.length >= TWO_COL_THRESHOLD;
      if (crowded) {
        dayEntries = dayEntries.slice().sort((a, b) => STATE_ORDER[a.states[d - 1]] - STATE_ORDER[b.states[d - 1]]);
      }
      const cols = crowded ? 2 : 1;
      const rows = Math.ceil(dayEntries.length / cols) || 1;
      const colWidth = cols === 1
        ? cellSize - CELL_H_PADDING
        : (cellSize - CELL_H_PADDING - COL_GAP) / 2;
      const formatEntry = (entry, state) => entry.name + "(" + STATE_LABEL[state] + ")";
      const texts = dayEntries.map((entry) => formatEntry(entry, entry.states[d - 1]));
      const fontSize = texts.length
        ? bestFontSize(texts, colWidth, availableHeight, rows, 9.5)
        : 9.5;
      let html = '<span class="daynum">' + d + "</span>";
      html += '<div class="list-entries' + (crowded ? " cols2" : "") + '" style="grid-template-rows:repeat(' + rows + ',auto)">';
      for (const entry of dayEntries) {
        const state = entry.states[d - 1];
        html += '<span class="list-entry ' + state + '" style="font-size:' + fontSize + 'px">' + escapeHtml(formatEntry(entry, state)) + "</span>";
      }
      html += "</div>";
      cell.innerHTML = html;
      listGrid.appendChild(cell);
    }
    correctOverflow();
  }

  function correctOverflow() {
    const cells = listGrid.querySelectorAll(".list-cell");
    cells.forEach((cell) => {
      const spans = cell.querySelectorAll(".list-entry");
      if (spans.length === 0) return;
      let guard = 0;
      while (guard < 40) {
        let overflowing = false;
        spans.forEach((s) => {
          if (s.scrollWidth > s.clientWidth + 0.5) overflowing = true;
        });
        if (!overflowing) return;
        const current = parseFloat(spans[0].style.fontSize) || 9.5;
        const next = current - 0.2;
        if (next < 4.0) return;
        spans.forEach((s) => { s.style.fontSize = next + "px"; });
        guard++;
      }
    });
  }

  const isInAppBrowser = /Line\/|FBAN|FBAV|Instagram|MicroMessenger/i.test(navigator.userAgent);
  const lineHint = document.getElementById("lineHint");
  if (isInAppBrowser) {
    lineHint.classList.remove("hidden");
  }

  document.getElementById("printBtn").addEventListener("click", () => {
    if (isInAppBrowser) {
      lineHint.classList.remove("hidden");
      lineHint.scrollIntoView({ behavior: "smooth", block: "center" });
      return;
    }
    window.print();
  });

  // A4 landscape print sizing: pick the smaller of (page width / 7 columns)
  // or (page height / rows this month needs), so a 6-row month never spills
  // onto a second page. Width comes from the fixed @page size (measuring it
  // live is unreliable — at beforeprint the browser can still be laid out
  // at the on-screen window width, not the real paper width, understating
  // it badly). Header height doesn't depend on width (no wrapping text in
  // it), so that part is safe to measure live from the real print layout
  // instead of guessed, since padding/margins are easy to miscount by hand.
  const PX_PER_MM = 96 / 25.4;
  const PRINT_PAGE_W_MM = 273; // A4 landscape width minus 12mm margins left+right
  const PRINT_PAGE_H_MM = 186; // A4 landscape height minus 12mm margins top+bottom
  const PRINT_GAP_MM = CELL_GAP * (25.4 / 96);
  const PANEL_H_PADDING_MM = 18 * (25.4 / 96) * 2; // .panel's left+right padding
  const PANEL_BOTTOM_PADDING_MM = 22 * (25.4 / 96);
  const PRINT_SAFETY_MM = 3;

  function applyPrintSizing() {
    const rows = Math.ceil((firstWeekday + daysInMonth) / 7);

    document.documentElement.style.removeProperty("--print-cell-mm");
    const sheetTop = document.querySelector(".sheet").getBoundingClientRect().top;
    const gridTop = listGrid.getBoundingClientRect().top;
    const headerMM = (gridTop - sheetTop) / PX_PER_MM;

    const cellFromWidthMM = (PRINT_PAGE_W_MM - PANEL_H_PADDING_MM - 6 * PRINT_GAP_MM) / 7;
    const availableHeightMM = PRINT_PAGE_H_MM - headerMM - PANEL_BOTTOM_PADDING_MM - PRINT_SAFETY_MM - (rows - 1) * PRINT_GAP_MM;
    const cellFromHeightMM = availableHeightMM / rows;
    const cellMM = Math.max(4, Math.min(cellFromWidthMM, cellFromHeightMM));

    document.documentElement.style.setProperty("--print-cell-mm", cellMM + "mm");
    renderListGrid(lastEntries, cellMM * PX_PER_MM);
  }

  function restoreScreenSizing() {
    renderListGrid(lastEntries);
  }

  window.addEventListener("beforeprint", applyPrintSizing);
  window.addEventListener("afterprint", restoreScreenSizing);

  document.getElementById("refreshListBtn").addEventListener("click", loadListFromFirestore);

  buildMonthPicker();
  applyMonthState();
  loadDraft();
  render();
})();
</script>

</body>
</html>
